kind: ConfigMap
apiVersion: v1
metadata:
  name: nginx
data:
  passwd: |
    root:x:0:0:root:/root:/bin/sh
    bin:x:1:1:bin:/bin:/sbin/nologin
    daemon:x:2:2:daemon:/sbin:/sbin/nologin
    lp:x:4:7:lp:/var/spool/lpd:/sbin/nologin
    sync:x:5:0:sync:/sbin:/bin/sync
    shutdown:x:6:0:shutdown:/sbin:/sbin/shutdown
    halt:x:7:0:halt:/sbin:/sbin/halt
    mail:x:8:12:mail:/var/mail:/sbin/nologin
    news:x:9:13:news:/usr/lib/news:/sbin/nologin
    uucp:x:10:14:uucp:/var/spool/uucppublic:/sbin/nologin
    cron:x:16:16:cron:/var/spool/cron:/sbin/nologin
    ftp:x:21:21::/var/lib/ftp:/sbin/nologin
    sshd:x:22:22:sshd:/dev/null:/sbin/nologin
    games:x:35:35:games:/usr/games:/sbin/nologin
    ntp:x:123:123:NTP:/var/empty:/sbin/nologin
    guest:x:405:100:guest:/dev/null:/sbin/nologin
    nobody:x:1000:1000:nobody:/:/sbin/nologin
  nginx.conf: |
    user              nobody;
    worker_processes  auto;

    pid        /var/run/nginx.pid;


    events {
      worker_connections  1024;
    }

    http {
      map_hash_bucket_size 128;

      include       mime.types;
      default_type  application/octet-stream;

      log_format  main  '$remote_addr - HTTP Origin: $http_origin - $remote_user [$time_local] "$request" '
      '$status $body_bytes_sent "$http_referer" '
      '"$http_user_agent" "$http_x_forwarded_for"';

      client_body_temp_path /var/run/openresty/nginx-client-body;
      proxy_temp_path       /var/run/openresty/nginx-proxy;
      fastcgi_temp_path     /var/run/openresty/nginx-fastcgi;
      uwsgi_temp_path       /var/run/openresty/nginx-uwsgi;
      scgi_temp_path        /var/run/openresty/nginx-scgi;

      access_log /dev/stdout main;
      error_log  /dev/stdout warn;

      sendfile        on;

      keepalive_timeout  65;

      include /etc/nginx/conf.d/*.conf;
    }

  security.conf: |
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

  performance.conf: |
    add_header X-UA-Compatible "IE=Edge";

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rss+xml
    application/geo+json
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    application/rdf+xml
    font/collection
    font/opentype
    font/otf
    font/ttf
    image/bmp
    image/svg+xml
    image/x-icon
    text/cache-manifest
    text/css
    text/javascript
    text/plain
    text/vcard
    text/vnd.rim.location.xloc
    text/vtt
    text/x-component
    text/x-cross-domain-policy;

    add_header Cache-Control "no-transform";

    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

  default.conf: |
    set_real_ip_from  172.16.0.0/16;
    set_real_ip_from  172.31.0.0/16;
    set_real_ip_from  10.30.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    map $http_x_forwarded_proto $fastcgi_param_https_variable {
      default '';
      https 'on';
    }

    server {
      listen 0.0.0.0:80 default_server;
      listen 0.0.0.0:8080;

      server_name service;

      resolver 127.0.0.11 ipv6=off;

      client_max_body_size 20m;

      access_log /dev/stdout;
      error_log /dev/stderr;

      index index.php index.html;

      root /var/www/public;

      location ~ \.nginx$ {
        deny all;

        return 403;
      }

      location / {
        try_files $uri $uri/ /index.php$is_args$args;
      }

      location /health {
          add_header Content-Type text/plain;
          return 200 'OK';
      }

      location ~ ^/index\.php(/|$) {
        fastcgi_pass    127.0.0.1:9000;

        include         fastcgi_params;

        fastcgi_param   SCRIPT_FILENAME    $document_root$fastcgi_script_name;
        fastcgi_param   SCRIPT_NAME        $fastcgi_script_name;
        fastcgi_param   HTTPS              $fastcgi_param_https_variable;
      }

      location ~ \.php$ {
        return 404;
      }

      include /etc/nginx/extras/security.conf;
      include /etc/nginx/extras/performance.conf;
    }
