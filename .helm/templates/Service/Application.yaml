apiVersion: v1
kind: Service
metadata:
  name: "application"
  labels:
    application.ehvg.dev/name: "snipe-it"
    application.ehvg.dev/version: "{{ .Values.application.version }}"
    application.ehvg.dev/environment: "production"
spec:
  type: "ClusterIP"
  ports:
    - port: 80
      targetPort: "http"
      protocol: "TCP"
      name: "http"
  selector:
    application.ehvg.dev/name: "snipe-it"
    application.ehvg.dev/environment: "production"
